<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  
  <!-- Primary Meta Tags -->
  <title>CinemaX - Your Ultimate Movie Booking Experience</title>
  <meta name="description" content="Book movie tickets online. Browse now showing movies, select your seats, and enjoy the best cinema experience with CinemaX.">
  <meta name="theme-color" content="#2a2a2a">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/favicon.ico">
  
  <!-- Basic PWA support (optional) -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Critical CSS for faster initial load -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    /* Loading screen */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    
    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(66, 184, 131, 0.3);
      border-top-color: #42b883;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 1.5rem;
      color: #42b883;
      font-size: 1.2rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div id="app-loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">🎬 Loading CinemaX...</div>
  </div>

  <!-- Vue App Root -->
  <div id="app"></div>
  
  <!-- Main App Script (bundled by Vite) -->
  <script type="module" src="/src/main.js"></script>
  
  <!-- Hide loading screen once Vue app is ready -->
  <script>
    window.addEventListener('load', () => {
      setTimeout(() => {
        const loading = document.getElementById('app-loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.3s';
          setTimeout(() => loading.remove(), 300);
        }
      }, 500);
    });
  </script>
</body>
</html>
